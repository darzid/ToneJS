name: Build and publish merged DAWSome page

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        
      - name: Version Increment
        uses: reecetech/version-increment@2026.8.4
        id: version
        with:
          scheme: semver
          increment: patch
  
      - name: Copy files
        run: |
          mkdir _site
          mkdir _site/DAWSome
          mkdir _site/PresetManager
          cp modules/DAWSome/DAWSome.js _site/DAWSome
          cp modules/PresetManager/PresetManager.js _site/PresetManager
          cp modules/PresetManager/preset-bank.js _site/PresetManager
      
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          tags: "ToneJS:${{ steps.version.outputs.version }}"

      - name: Create tag & GitHub release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          generate_release_notes: true
          prerelease: false
          tag_name: ${{ steps.version.outputs.version }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
